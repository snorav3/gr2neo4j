services:
  neo4j:
    image: neo4j:latest
    environment:
        NEO4J_AUTH: neo4j/my_pwd
        NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - ./neo4j/logs:/logs
      - ./neo4j/conf:/conf
      - ./neo4j/data:/data
      - ./neo4j/plugins:/plugins